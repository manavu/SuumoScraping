version: '3'
services:
  db:
    image: mysql:8.4
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=scrapingdb
      - MYSQL_USER=docker
      - MYSQL_PASSWORD=docker
      - TZ=Asia/Tokyo
    ports:
      - 3306:3306
    volumes:
      - db-data:/var/lib/mysql
      # windows の場合は my.cnf を読み込み専用にすることでマウント先も読み込み専用になる
      - ./db/conf.d/my.cnf:/etc/mysql/conf.d/my.cnf
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - 5000:5000
    volumes:
      - ../:/workspace:cached
    links:
      - db
    tty: true # make container stay launched
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
      - PMA_USER=docker
      - PMA_PASSWORD=docker
    links:
      - db
    ports:
      - 8080:80
    volumes:
      - ./phpmyadmin/sessions:/sessions

volumes:
  db-data:
